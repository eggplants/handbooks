<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title desc">
  <title id="title">ghq get が受け取る書き方</title>
  <desc id="desc">https の URL、SCP 形式、ホストからの書き方、オーナーからの書き方のどれで渡しても、github.com、x-motemen、ghq の三つに分けられ、置き場所は ~/ghq/github.com/x-motemen/ghq の一つに決まる。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .white{fill:#ffffff;stroke:#cfcfcf;stroke-width:2}
    .box{fill:#ffffff;stroke:#cfcfcf;stroke-width:2;stroke-dasharray:6 5}
    .host{fill:#dce9ff;stroke:#3f7bdc;stroke-width:2}
    .owner{fill:#d9f4e6;stroke:#2f9e6e;stroke-width:2}
    .repo{fill:#ffecc7;stroke:#e39623;stroke-width:2}
    .th{fill:#1f4fa0}
    .to{fill:#1d6b48}
    .tr{fill:#9a5a00}
    .folder{fill:#ffd98a;stroke:#d9a43a;stroke-width:4}
    .line{fill:none;stroke:#b0b0b0;stroke-width:2.5;stroke-linecap:round}
    .arrow{fill:none;stroke:#8f8f8f;stroke-width:4;stroke-linecap:round;marker-end:url(#ah)}
  </style>
  <defs>
    <symbol id="folder" viewBox="0 0 100 76">
      <path d="M6 14a8 8 0 0 1 8-8h22l9 9h41a8 8 0 0 1 8 8v39a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/>
    </symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="286" rx="20"/>

  <!-- inputs -->
  <text class="t b mute" x="160" y="34" font-size="15" text-anchor="middle">どの書き方でも</text>
  <rect class="white" x="20" y="50" width="280" height="34" rx="10"/>
  <text class="t m" x="160" y="72" font-size="13" text-anchor="middle">https://github.com/x-motemen/ghq</text>
  <rect class="white" x="20" y="100" width="280" height="34" rx="10"/>
  <text class="t m" x="160" y="122" font-size="13" text-anchor="middle">git@github.com:x-motemen/ghq.git</text>
  <rect class="white" x="20" y="150" width="280" height="34" rx="10"/>
  <text class="t m" x="160" y="172" font-size="13" text-anchor="middle">github.com/x-motemen/ghq</text>
  <rect class="white" x="20" y="200" width="280" height="34" rx="10"/>
  <text class="t m" x="160" y="222" font-size="13" text-anchor="middle">x-motemen/ghq</text>

  <path class="line" d="M306 67C334 67 334 150 352 150M306 117C330 117 330 150 352 150M306 167C330 167 330 150 352 150M306 217C334 217 334 150 352 150"/>
  <path class="arrow" d="M352 150H364"/>

  <!-- parts -->
  <rect class="box" x="374" y="80" width="170" height="140" rx="14"/>
  <rect class="host" x="384" y="92" width="150" height="34" rx="10"/>
  <text class="t m th" x="459" y="114" font-size="15" text-anchor="middle">github.com</text>
  <rect class="owner" x="384" y="133" width="150" height="34" rx="10"/>
  <text class="t m to" x="459" y="155" font-size="15" text-anchor="middle">x-motemen</text>
  <rect class="repo" x="384" y="174" width="150" height="34" rx="10"/>
  <text class="t m tr" x="459" y="196" font-size="15" text-anchor="middle">ghq</text>

  <path class="arrow" d="M552 150H584"/>

  <!-- destination -->
  <use href="#folder" class="folder" x="594" y="108" width="106" height="82"/>
  <text class="t b" x="647" y="220" font-size="15" text-anchor="middle">置き場所は一つ</text>
  <text class="t m mute" x="700" y="266" font-size="12" text-anchor="end">~/ghq/github.com/x-motemen/ghq</text>
</svg>
