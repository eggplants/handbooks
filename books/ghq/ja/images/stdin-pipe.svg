<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title desc">
  <title id="title">標準入力から ghq get へ</title>
  <desc id="desc">ghq list、gh api user/starred、go list -m all、git config -f .gitmodules など、リポジトリを 1 行に一つずつ出力するコマンドをパイプで ghq get -P に渡すと、まとめて並列に取得する。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .white{fill:#ffffff;stroke:#cfcfcf;stroke-width:2}
    .host{fill:#dce9ff;stroke:#3f7bdc;stroke-width:2.5}
    .th{fill:#1f4fa0}
    .folder{fill:#ffd98a;stroke:#d9a43a;stroke-width:6}
    .line{fill:none;stroke:#b0b0b0;stroke-width:2.5;stroke-linecap:round}
    .arrow{fill:none;stroke:#8f8f8f;stroke-width:3;stroke-linecap:round;marker-end:url(#ah)}
  </style>
  <defs>
    <symbol id="folder" viewBox="0 0 100 76">
      <path d="M6 14a8 8 0 0 1 8-8h22l9 9h41a8 8 0 0 1 8 8v39a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/>
    </symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="286" rx="20"/>

  <!-- sources -->
  <rect class="white" x="20" y="36" width="236" height="38" rx="10"/>
  <text class="t m" x="138" y="60" font-size="13" text-anchor="middle">ghq list</text>
  <rect class="white" x="20" y="90" width="236" height="38" rx="10"/>
  <text class="t m" x="138" y="114" font-size="13" text-anchor="middle">gh api user/starred</text>
  <rect class="white" x="20" y="144" width="236" height="38" rx="10"/>
  <text class="t m" x="138" y="168" font-size="13" text-anchor="middle">go list -m all</text>
  <rect class="white" x="20" y="198" width="236" height="38" rx="10"/>
  <text class="t m" x="138" y="222" font-size="13" text-anchor="middle">git config -f .gitmodules</text>

  <path class="line" d="M262 55C290 55 290 140 306 140M262 109C286 109 286 140 306 140M262 163C286 163 286 140 306 140M262 217C290 217 290 140 306 140"/>
  <path class="arrow" d="M306 140H318"/>

  <!-- ghq get -P -->
  <rect class="host" x="326" y="114" width="150" height="52" rx="14"/>
  <text class="t m b th" x="401" y="146" font-size="18" text-anchor="middle">ghq get -P</text>
  <text class="t mute" x="401" y="194" font-size="13" text-anchor="middle">6 つずつ同時に</text>

  <!-- fan out -->
  <path class="arrow" d="M482 132C510 120 512 84 530 84"/>
  <path class="arrow" d="M482 140H530"/>
  <path class="arrow" d="M482 148C510 160 512 196 530 196"/>

  <use href="#folder" class="folder" x="540" y="66" width="44" height="34"/>
  <use href="#folder" class="folder" x="596" y="66" width="44" height="34"/>
  <use href="#folder" class="folder" x="652" y="66" width="44" height="34"/>
  <use href="#folder" class="folder" x="540" y="122" width="44" height="34"/>
  <use href="#folder" class="folder" x="596" y="122" width="44" height="34"/>
  <use href="#folder" class="folder" x="652" y="122" width="44" height="34"/>
  <use href="#folder" class="folder" x="540" y="178" width="44" height="34"/>
  <use href="#folder" class="folder" x="596" y="178" width="44" height="34"/>
  <use href="#folder" class="folder" x="652" y="178" width="44" height="34"/>
  <text class="t mute" x="618" y="244" font-size="14" text-anchor="middle">まとめて取得</text>
</svg>
