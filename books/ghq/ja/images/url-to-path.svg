<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
  <title id="title">URL から置き場所への対応</title>
  <desc id="desc">https://github.com/x-motemen/ghq の https:// は使わず、github.com、x-motemen、ghq がそれぞれホスト、オーナー、リポジトリ名として ~/ghq の下の階層になる。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .gray{fill:#f1f1f1;stroke:#a9a9a9;stroke-width:2}
    .dash{stroke-dasharray:6 5}
    .host{fill:#dce9ff;stroke:#3f7bdc;stroke-width:2.5}
    .owner{fill:#d9f4e6;stroke:#2f9e6e;stroke-width:2.5}
    .repo{fill:#ffecc7;stroke:#e39623;stroke-width:2.5}
    .th{fill:#1f4fa0}
    .to{fill:#1d6b48}
    .tr{fill:#9a5a00}
    .ah{fill:none;stroke-width:4;stroke-linecap:round}
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3f7bdc"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e39623"/></marker>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="296" rx="20"/>

  <!-- URL row -->
  <text class="t b mute" x="40" y="46" font-size="16">URL</text>
  <rect class="gray dash" x="40" y="58" width="150" height="50" rx="12"/>
  <text class="t m mute" x="115" y="90" font-size="21" text-anchor="middle">https://</text>
  <rect class="host" x="206" y="58" width="180" height="50" rx="12"/>
  <text class="t m th" x="296" y="90" font-size="21" text-anchor="middle">github.com</text>
  <text class="t m mute" x="398" y="91" font-size="24" text-anchor="middle">/</text>
  <rect class="owner" x="410" y="58" width="165" height="50" rx="12"/>
  <text class="t m to" x="492.5" y="90" font-size="21" text-anchor="middle">x-motemen</text>
  <text class="t m mute" x="587" y="91" font-size="24" text-anchor="middle">/</text>
  <rect class="repo" x="599" y="58" width="80" height="50" rx="12"/>
  <text class="t m tr" x="639" y="90" font-size="21" text-anchor="middle">ghq</text>
  <text class="t mute" x="115" y="132" font-size="14" text-anchor="middle">使わない</text>

  <!-- arrows -->
  <path class="ah" stroke="#3f7bdc" marker-end="url(#ab)" d="M296 116V186"/>
  <path class="ah" stroke="#2f9e6e" marker-end="url(#ag)" d="M492.5 116V186"/>
  <path class="ah" stroke="#e39623" marker-end="url(#ao)" d="M639 116V186"/>

  <!-- path row -->
  <text class="t b mute" x="40" y="188" font-size="16">置き場所</text>
  <rect class="gray" x="60" y="200" width="120" height="50" rx="12"/>
  <text class="t m" x="120" y="232" font-size="21" text-anchor="middle">~/ghq</text>
  <text class="t m mute" x="193" y="233" font-size="24" text-anchor="middle">/</text>
  <rect class="host" x="206" y="200" width="180" height="50" rx="12"/>
  <text class="t m th" x="296" y="232" font-size="21" text-anchor="middle">github.com</text>
  <text class="t m mute" x="398" y="233" font-size="24" text-anchor="middle">/</text>
  <rect class="owner" x="410" y="200" width="165" height="50" rx="12"/>
  <text class="t m to" x="492.5" y="232" font-size="21" text-anchor="middle">x-motemen</text>
  <text class="t m mute" x="587" y="233" font-size="24" text-anchor="middle">/</text>
  <rect class="repo" x="599" y="200" width="80" height="50" rx="12"/>
  <text class="t m tr" x="639" y="232" font-size="21" text-anchor="middle">ghq</text>

  <text class="t" x="120" y="276" font-size="14" text-anchor="middle">ルート</text>
  <text class="t th" x="296" y="276" font-size="14" text-anchor="middle">ホスト</text>
  <text class="t to" x="492.5" y="276" font-size="14" text-anchor="middle">オーナー</text>
  <text class="t tr" x="639" y="276" font-size="14" text-anchor="middle">リポジトリ名</text>
</svg>
