<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="title desc">
  <title id="title">ghq migrate でリポジトリを移す</title>
  <desc id="desc">~/old/mytool にあるリポジトリは、リモート origin が github.com/alice/mytool を指している。ghq migrate は、このディレクトリを中身ごと ~/ghq/github.com/alice/mytool へ移す。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .oldf{fill:#f1f1f1;stroke:#a9a9a9;stroke-width:4}
    .white{fill:#ffffff;stroke:#cfcfcf;stroke-width:2}
    .gray{fill:#f1f1f1;stroke:#a9a9a9;stroke-width:2}
    .host{fill:#dce9ff;stroke:#3f7bdc;stroke-width:2}
    .owner{fill:#d9f4e6;stroke:#2f9e6e;stroke-width:2}
    .repo{fill:#ffecc7;stroke:#e39623;stroke-width:2}
    .th{fill:#1f4fa0}
    .to{fill:#1d6b48}
    .tr{fill:#9a5a00}
    .line{fill:none;stroke:#b9b9b9;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <symbol id="folder" viewBox="0 0 100 76">
      <path d="M6 14a8 8 0 0 1 8-8h22l9 9h41a8 8 0 0 1 8 8v39a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/>
    </symbol>
    <marker id="ag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="276" rx="20"/>

  <!-- old place -->
  <text class="t m b" x="140" y="48" font-size="16" text-anchor="middle">~/old/mytool</text>
  <g transform="rotate(-6 140 116)">
    <use href="#folder" class="oldf" x="82" y="70" width="116" height="88"/>
  </g>
  <path d="M140 164V186" fill="none" stroke="#a9a9a9" stroke-width="2" stroke-dasharray="4 4"/>
  <rect class="white" x="14" y="188" width="262" height="38" rx="10"/>
  <circle cx="29" cy="207" r="5" fill="none" stroke="#a9a9a9" stroke-width="2"/>
  <text class="t m" x="154" y="212" font-size="12" text-anchor="middle">origin: github.com/alice/mytool</text>

  <!-- move -->
  <text class="t m b" x="344" y="112" font-size="16" text-anchor="middle">ghq migrate</text>
  <path d="M290 134H392" fill="none" stroke="#2f9e6e" stroke-width="8" stroke-linecap="round" marker-end="url(#ag)"/>

  <!-- new place -->
  <path class="line" d="M438 96V125H456"/>
  <path class="line" d="M476 142V170H500"/>
  <path class="line" d="M596 170H616"/>
  <rect class="gray" x="420" y="62" width="92" height="34" rx="17"/>
  <text class="t m" x="466" y="85" font-size="16" text-anchor="middle">~/ghq</text>
  <rect class="host" x="456" y="108" width="128" height="34" rx="12"/>
  <text class="t m th" x="520" y="131" font-size="16" text-anchor="middle">github.com</text>
  <rect class="owner" x="500" y="154" width="96" height="32" rx="12"/>
  <text class="t m to" x="548" y="176" font-size="15" text-anchor="middle">alice</text>
  <rect class="repo" x="616" y="154" width="88" height="32" rx="12"/>
  <text class="t m tr" x="660" y="176" font-size="15" text-anchor="middle">mytool</text>

  <text class="t mute" x="360" y="258" font-size="15" text-anchor="middle">クローンし直さず、中身ごと移す</text>
</svg>
