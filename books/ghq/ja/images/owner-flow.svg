<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-labelledby="title desc">
  <title id="title">オーナーを補う順番</title>
  <desc id="desc">ghq get peco のようにリポジトリ名だけを渡すと、ghq.completeUser が false か、ghq.user があるか、GitHub のユーザー名が分かるか、の順に調べ、最初に当てはまったものでオーナーを決める。どれもなければログイン名 USER を使う。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .gray{fill:#f1f1f1;stroke:#a9a9a9;stroke-width:2}
    .white{fill:#ffffff;stroke:#cfcfcf;stroke-width:2}
    .res{fill:#ffffff;stroke:#2f9e6e;stroke-width:2}
    .to{fill:#1d6b48}
    .tr{fill:#9a5a00}
    .arrow{fill:none;stroke:#8f8f8f;stroke-width:3;stroke-linecap:round;marker-end:url(#ah)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="386" rx="20"/>

  <rect class="gray" x="30" y="20" width="200" height="42" rx="21"/>
  <text class="t m b" x="130" y="47" font-size="17" text-anchor="middle">ghq get peco</text>
  <path class="arrow" d="M130 66V82"/>

  <!-- 1 -->
  <rect class="white" x="30" y="88" width="320" height="52" rx="12"/>
  <circle cx="60" cy="114" r="15" fill="#3f7bdc"/>
  <text class="t b" x="60" y="120" font-size="16" text-anchor="middle" style="fill:#ffffff">1</text>
  <text class="t m" x="86" y="120" font-size="14">ghq.completeUser = false</text>
  <path class="arrow" d="M356 114H418"/>
  <text class="t mute" x="384" y="104" font-size="13" text-anchor="middle">はい</text>
  <rect class="res" x="426" y="94" width="270" height="40" rx="12"/>
  <text class="t m" x="561" y="120" font-size="16" text-anchor="middle"><tspan class="to">peco</tspan><tspan class="tr">/peco</tspan></text>
  <path class="arrow" d="M190 144V160"/>
  <text class="t mute" x="204" y="157" font-size="13">いいえ</text>

  <!-- 2 -->
  <rect class="white" x="30" y="166" width="320" height="52" rx="12"/>
  <circle cx="60" cy="192" r="15" fill="#3f7bdc"/>
  <text class="t b" x="60" y="198" font-size="16" text-anchor="middle" style="fill:#ffffff">2</text>
  <text class="t m" x="86" y="198" font-size="14">ghq.user</text>
  <path class="arrow" d="M356 192H418"/>
  <text class="t mute" x="384" y="182" font-size="13" text-anchor="middle">ある</text>
  <rect class="res" x="426" y="172" width="270" height="40" rx="12"/>
  <text class="t" x="561" y="198" font-size="16" text-anchor="middle"><tspan class="to">その値</tspan><tspan class="m tr">/peco</tspan></text>
  <path class="arrow" d="M190 222V238"/>
  <text class="t mute" x="204" y="235" font-size="13">ない</text>

  <!-- 3 -->
  <rect class="white" x="30" y="244" width="320" height="52" rx="12"/>
  <circle cx="60" cy="270" r="15" fill="#3f7bdc"/>
  <text class="t b" x="60" y="276" font-size="16" text-anchor="middle" style="fill:#ffffff">3</text>
  <text class="t" x="86" y="276" font-size="15">GitHub のユーザー名</text>
  <path class="arrow" d="M356 270H418"/>
  <text class="t mute" x="384" y="260" font-size="13" text-anchor="middle">ある</text>
  <rect class="res" x="426" y="250" width="270" height="40" rx="12"/>
  <text class="t" x="561" y="276" font-size="16" text-anchor="middle"><tspan class="to">その値</tspan><tspan class="m tr">/peco</tspan></text>
  <path class="arrow" d="M190 300V316"/>
  <text class="t mute" x="204" y="313" font-size="13">ない</text>

  <!-- 4 -->
  <rect class="white" x="30" y="322" width="320" height="52" rx="12"/>
  <circle cx="60" cy="348" r="15" fill="#3f7bdc"/>
  <text class="t b" x="60" y="354" font-size="16" text-anchor="middle" style="fill:#ffffff">4</text>
  <text class="t" x="86" y="354" font-size="15">ログイン名（<tspan class="m">USER</tspan>）</text>
  <path class="arrow" d="M356 348H418"/>
  <rect class="res" x="426" y="328" width="270" height="40" rx="12"/>
  <text class="t m" x="561" y="354" font-size="16" text-anchor="middle"><tspan class="to">alice</tspan><tspan class="tr">/peco</tspan></text>
</svg>
