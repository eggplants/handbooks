<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc">
  <title id="title">複数のルート</title>
  <desc id="desc">~/src が主ルートで、新しいクローンはここに置かれる。~/go/src はクローン済みのリポジトリを探すだけのルート。~/work は github.com/acme のリポジトリだけを置く URL ごとのルート。ghq は三つのルートすべてを探す。</desc>
  <style>
    .card{fill:#fffaf0;stroke:#efe2c8;stroke-width:2}
    .t{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;fill:#3b3b3b}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace}
    .b{font-weight:700}
    .mute{fill:#7d7d7d}
    .fa{fill:#ffecc7;stroke:#e39623;stroke-width:4}
    .fb{fill:#f1f1f1;stroke:#a9a9a9;stroke-width:4}
    .fc{fill:#dce9ff;stroke:#3f7bdc;stroke-width:4}
    .line{fill:none;stroke:#a9a9a9;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <symbol id="folder" viewBox="0 0 100 76">
      <path d="M6 14a8 8 0 0 1 8-8h22l9 9h41a8 8 0 0 1 8 8v39a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z"/>
    </symbol>
  </defs>

  <rect class="card" x="2" y="2" width="716" height="296" rx="20"/>

  <!-- search bracket -->
  <path class="line" d="M130 84V66H590V84"/>
  <circle cx="300" cy="44" r="9" fill="none" stroke="#7d7d7d" stroke-width="3"/>
  <path d="M306.5 50.5L313 57" stroke="#7d7d7d" stroke-width="3.5" stroke-linecap="round"/>
  <text class="t mute" x="322" y="50" font-size="15">ぜんぶ探す</text>

  <!-- primary root -->
  <use href="#folder" class="fa" x="70" y="90" width="120" height="92"/>
  <polygon points="184,82 188.1,92.3 199.2,93.1 190.7,100.2 193.4,110.9 184,105 174.6,110.9 177.3,100.2 168.8,93.1 179.9,92.3" fill="#ffcf3f" stroke="#d9a43a" stroke-width="2" stroke-linejoin="round"/>
  <text class="t m b" x="130" y="212" font-size="17" text-anchor="middle">~/src</text>
  <text class="t b" x="130" y="240" font-size="14" text-anchor="middle">主ルート</text>
  <text class="t mute" x="130" y="264" font-size="13" text-anchor="middle">新しいクローンはここ</text>

  <!-- other root -->
  <use href="#folder" class="fb" x="300" y="90" width="120" height="92"/>
  <text class="t m b" x="360" y="212" font-size="17" text-anchor="middle">~/go/src</text>
  <text class="t b" x="360" y="240" font-size="14" text-anchor="middle">ほかのルート</text>
  <text class="t mute" x="360" y="264" font-size="13" text-anchor="middle">探すだけ</text>

  <!-- URL-specific root -->
  <use href="#folder" class="fc" x="530" y="90" width="120" height="92"/>
  <text class="t m b" x="590" y="212" font-size="17" text-anchor="middle">~/work</text>
  <text class="t b" x="590" y="240" font-size="14" text-anchor="middle">URL ごとのルート</text>
  <text class="t mute" x="590" y="264" font-size="13" text-anchor="middle">acme のリポジトリだけ</text>
</svg>
